<style>
  :root { --vt: 0px; --vb: 0px; --yellow: #ffd23f; --green: #3ddc84; --blue: #3aa0ff; --red: #ff4d5e; --ink: #0a0f2a; }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .top { position: absolute; top: max(calc(var(--vt) + 10px), env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
  .pill { background: rgba(10,15,42,.6); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 0 14px rgba(80,120,255,.18); border-radius: 18px; padding: 6px 14px; font-size: 18px; display: inline-flex; align-items: center; gap: 6px; }
  .pill.boss { background: var(--red); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { background: #b3122a; } }
  #board { background: rgba(10,15,42,.55); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 6px 10px; font-size: 12px; min-width: 120px; }
  #board div { display: flex; justify-content: space-between; gap: 10px; line-height: 1.5; font-weight: 800; }
  #board .me { color: var(--yellow); }
  #toast { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: 30px; opacity: 0; transition: opacity .25s, transform .25s; transform: scale(.8); }
  #toast.show { opacity: 1; transform: scale(1); }
  #mute { position: absolute; bottom: max(calc(var(--vb) + 14px), env(safe-area-inset-bottom)); right: 14px; width: 44px; height: 44px; border-radius: 50%; background: rgba(10,15,42,.45); border: 0; pointer-events: auto; display: grid; place-items: center; }
  #mute svg { width: 22px; height: 22px; fill: #fff; }
  #boost { position: absolute; bottom: max(calc(var(--vb) + 70px), calc(env(safe-area-inset-bottom) + 56px)); right: 14px; width: 78px; height: 78px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 35% 30%, #ffe680, var(--yellow) 50%, #e09a00); box-shadow: 0 5px 0 var(--ink); pointer-events: auto; display: grid; place-items: center; touch-action: none; }
  #boost svg { width: 36px; height: 36px; fill: #fff; stroke: var(--ink); stroke-width: 1.6; }
  #boost.on { transform: translateY(3px) scale(.96); box-shadow: 0 2px 0 var(--ink), 0 0 26px #ffd23f; }
  #boost.off { filter: grayscale(1); opacity: .55; }
  body.menu #boost, body.menu #mini, body.menu #feed, body.menu #pw { visibility: hidden; }
  #mini { position: absolute; top: auto; right: auto; left: 12px; bottom: max(calc(var(--vb) + 14px), env(safe-area-inset-bottom)); width: 96px; height: 96px; }
  #feed { position: absolute; top: max(calc(var(--vt) + 138px), calc(env(safe-area-inset-top) + 128px)); left: 10px; font-size: 13px; line-height: 1.6; }
  #feed div { animation: fin .25s ease-out; }
  @keyframes fin { from { opacity: 0; transform: translateX(-12px); } }
  #pw { position: absolute; top: 50%; left: 10px; display: flex; flex-direction: column; gap: 6px; }
  #pw .pill { font-size: 14px; padding: 4px 10px; }
  #tut { position: absolute; left: 0; right: 0; bottom: 30%; text-align: center; font-size: 22px; opacity: 0; transition: opacity .4s; }
  #tut.show { opacity: 1; }
  #heat { font-size: 14px; padding: 4px 12px; color: #ffd23f; }
  #heat.hot { background: rgba(255,77,94,.55); color: #fff; }
  #np { position: absolute; left: 0; right: 0; bottom: max(calc(var(--vb) + 118px), calc(env(safe-area-inset-bottom) + 104px)); text-align: center; font-size: 13px; font-weight: 800; opacity: 0; transition: opacity .6s; pointer-events: none; }

  .logo { font-size: 64px; line-height: .9; color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink), 0 0 34px rgba(255,210,63,.55); transform: rotate(-4deg); }
  .logo span { text-shadow: 0 6px 0 var(--ink), 0 0 34px rgba(61,220,132,.6); }
  .logo span { color: var(--green); display: block; }
  .btn { pointer-events: auto; border: 0; cursor: pointer; font: inherit; font-weight: 900; color: #fff; border-radius: 18px; padding: 16px 40px; font-size: 26px; background: linear-gradient(180deg, #5cf09c, var(--green) 60%, #27b86a); box-shadow: 0 6px 0 #1e8f52, 0 0 28px rgba(61,220,132,.45); -webkit-text-stroke: 1.2px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 var(--ink); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e8f52; }
  .btn.blue { background: linear-gradient(180deg, #6ebcff, var(--blue) 60%, #2478d6); box-shadow: 0 6px 0 #1c64b3, 0 0 28px rgba(58,160,255,.45); }
  .btn.small { font-size: 16px; padding: 10px 14px; border-radius: 14px; }
  .coins { position: absolute; top: max(calc(var(--vt) + 14px), env(safe-area-inset-top)); right: 14px; font-size: 22px; }
  .coin { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6b0, var(--yellow) 45%, #d99a00); border: 2px solid var(--ink); vertical-align: -4px; margin-right: 6px; }
  .ups { display: flex; gap: 10px; margin-top: 28px; }
  .up { pointer-events: auto; width: 100px; padding: 10px 6px 8px; border-radius: 16px; background: rgba(10,15,42,.7); border: 2px solid rgba(255,255,255,.18); box-shadow: 0 0 16px rgba(80,120,255,.2); color: #fff; font: inherit; cursor: pointer; }
  .up b { display: block; font-size: 14px; font-weight: 900; }
  .up i { display: block; font-style: normal; font-size: 12px; opacity: .8; margin: 2px 0 6px; }
  .up span { display: inline-block; font-size: 14px; font-weight: 900; background: var(--yellow); color: var(--ink); border-radius: 10px; padding: 2px 8px; }
  .up[disabled] { opacity: .45; }
  .play { margin-top: 30px; }
  .hint { margin-top: 18px; font-size: 15px; font-weight: 800; opacity: .9; }
  .credit { position: absolute; left: 0; right: 0; bottom: max(calc(var(--vb) + 12px), env(safe-area-inset-bottom)); text-align: center; font-size: 12px; letter-spacing: .12em; opacity: .75; }
  .res h2 { font-size: 46px; }
  .rank { font-size: 22px; margin-top: 10px; }

  .row { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }

<script>
(() => {
  // Snake Rumble - (c) 2026 Kia Vafa. Original game code and music; no third-party libraries.
  // YouTube Playables SDK (loaded by the script tag in the bundle build; absent in the web preview)
  const yt = (window.ytgame && window.ytgame.game && typeof window.ytgame.game.gameReady === 'function') ? window.ytgame : null;
  const SONGS = [{ f: 'song_333.mp3', t: '3:33' }, { f: 'song_poolside.mp3', t: 'Pool Side' }, { f: 'song_wrongmiss.mp3', t: 'Wrong Miss' }]; // short low-volume clips, all by Kia Vafa
  const GOD = false;
  const TS = 1;
  const SHOW_FPS = false; // web preview only: tiny frame-rate readout for testing
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- tuning ----------
  const FIELD = 1500;            // endless field: things live within this radius of the player, the rest is recycled
  const MINI_R = 1200;           // minimap radius (world units) around the player
  const ROUND = 75, BOSS_TIME = 25;
  const ORBS = 240, BOTS_MIN = 8, BOTS_MAX = 13, HEAT_EVERY = 12; // every 12 s the arena gets one step meaner
  const ORB_PAL = ['#4df3ff', '#9dff4d', '#ff5ecf', '#ffd23f', '#ffa03d'];
  const NAMES = ['Mia', 'Leo', 'Zed', 'Kai', 'Nova', 'Rex', 'Luna', 'Ari', 'Max', 'Ivy', 'Jax', 'Sky', 'Remy', 'Ola', 'Tom', 'Yuki', 'Pip', 'Dex'];
  const SKINS = [
    ['#3ddc84', '#1fae5f'], ['#ff6fb5', '#d93d8a'], ['#3aa0ff', '#1d6fd1'], ['#ff8a3d', '#e05a12'],
    ['#b07bff', '#7a45e0'], ['#ff4d5e', '#c91f33'], ['#29d3c4', '#139a8e'], ['#ffd23f', '#e0a800'],
  ];
  const SHOP = [
    { c: ['#ffe14d', '#f08a00'], cost: 0 }, { c: ['#3ddc84', '#1fae5f'], cost: 60 }, { c: ['#ff6fb5', '#d93d8a'], cost: 90 },
    { c: ['#3aa0ff', '#1d6fd1'], cost: 120 }, { c: ['#b07bff', '#7a45e0'], cost: 160 }, { c: ['#2b2d42', '#ff7a1a'], cost: 220, stripe: '#ff7a1a' },
    { c: ['#ffffff', '#9fb4ff'], cost: 300, stripe: '#ff4d5e' }, { c: ['#ff4d5e', '#ffd23f'], cost: 400, rainbow: true },
  ];
  const playerSkin = () => { const k = SHOP[save.skin || 0] || SHOP[0]; return Object.assign([k.c[0], k.c[1]], { stripe: k.stripe, rainbow: k.rainbow }); };
  const POWERS = {
    magnet: { color: '#b07bff', dark: '#6a33d6', time: 8, label: 'MAGNET' },
    speed: { color: '#3aa0ff', dark: '#1d5fd1', time: 6, label: 'TURBO' },
    double: { color: '#3ddc84', dark: '#169c55', time: 10, label: 'x2 ORBS' },
  };

  // ---------- save ----------
  const defaultSave = () => ({ coins: 0, up: { start: 0, speed: 0, magnet: 0 }, best: 0, skin: 0, owned: [0], tut: 0, rounds: 0, music: 1, sfx: 1, haptics: 1 });
  let save = defaultSave(), saveReady = false, saveDirty = false;
  // Never trust stored data: clamp every field to a sane type and range so a bad or edited save can't break the game.
  function sanitize(raw) {
    const out = defaultSave();
    if (!raw || typeof raw !== 'object') return out;
    const int = (v, lo, hi, d) => Number.isFinite(+v) ? Math.max(lo, Math.min(hi, Math.floor(+v))) : d;
    out.coins = int(raw.coins, 0, 1e7, 0); out.best = int(raw.best, 0, 1e6, 0); out.rounds = int(raw.rounds, 0, 1e7, 0); out.tut = int(raw.tut, 0, 1, 0);
    out.music = int(raw.music, 0, 1, 1); out.sfx = int(raw.sfx, 0, 1, 1); out.haptics = int(raw.haptics, 0, 1, 1);
    const up = raw.up && typeof raw.up === 'object' ? raw.up : {};
    out.up = { start: int(up.start, 0, 30, 0), speed: int(up.speed, 0, 8, 0), magnet: int(up.magnet, 0, 10, 0) };
    out.owned = [...new Set([0, ...(Array.isArray(raw.owned) ? raw.owned.map(v => int(v, 0, SHOP.length - 1, 0)) : [])])];
    out.skin = int(raw.skin, 0, SHOP.length - 1, 0); if (!out.owned.includes(out.skin)) out.skin = 0;
    return out;
  }
  function loadLocal() { try { save = sanitize(JSON.parse(localStorage.getItem('rumble-save') || 'null')); } catch (e) { save = defaultSave(); } }
  // Resolves when cloud data has been read (or after a timeout, so a slow network never blocks play).
  function loadCloud() {
    if (!yt) { loadLocal(); saveReady = true; return Promise.resolve(); }
    return Promise.race([
      yt.game.loadData().then(d => { try { save = sanitize(JSON.parse(d || 'null')); } catch (e) { save = defaultSave(); } saveReady = true; }),
      new Promise(r => setTimeout(r, 4000)),
    ]).catch(() => {});
  }
  function writeSave() {
    const d = JSON.stringify(save);
    if (!yt) { try { localStorage.setItem('rumble-save', d); } catch (e) {} return; }
    if (!saveReady) { saveDirty = true; return; }        // saveData is rejected before loadData resolved
    saveDirty = false; yt.game.saveData(d).catch(() => { saveDirty = true; });
  }
  const UPS = [
    { id: 'start', name: 'START LV', desc: l => `Begin at LV ${1 + l * 4}`, cost: l => 40 + l * 45 },
    { id: 'speed', name: 'SPEED', desc: l => `+${l * 4}% speed`, cost: l => 50 + l * 55, max: 8 },
    { id: 'magnet', name: 'MAGNET', desc: l => `Pull radius ${40 + l * 12}`, cost: l => 45 + l * 50, max: 10 },
  ];

  // ---------- audio ----------
  let ac = null, master, musicBus = null, sfxBus = null, music = null, musicBufs = [], muted = false, songIdx = -1, npT = 0;
  function initAudio() {
    if (ac) { ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();

    const vis = (x, y) => Math.abs(x - cam.x) < vw && Math.abs(y - cam.y) < vh;
    // orbs
    for (const o of orbs) {
      if (!vis(o.x, o.y)) continue;
      const r = o.v > 1 ? 10 : 6.5, b = Math.sin(t * 4 + o.bob) * 2;
      orb(o.x, o.y + b, r, o.c, o.glow);
    }
    for (const q of powers) {
      if (!vis(q.x, q.y)) continue;
      const P = POWERS[q.type], y = q.y + Math.sin(t * 3 + q.bob) * 4, r = 20 + Math.sin(t * 5 + q.bob) * 1.5;
      ctx.fillStyle = P.color + '33'; ctx.beginPath(); ctx.arc(q.x, y, r + 16, 0, Math.PI * 2); ctx.fill();
      ball(q.x, y, r, P.color, P.dark, false);
      powerIcon(q.type, q.x, y, r);
    }
    // snakes (smaller under bigger)
    const order = snakes.filter(s => !s.dead).sort((a, b) => a.lv - b.lv);
    for (const s of order) if (s.segs.some((g, i) => i % 6 === 0 && vis(g.x, g.y))) drawSnake(s, t);
    // particles
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;
      ctx.globalAlpha = Math.min(1, p.life * 2); ball(p.x, p.y, 4.5, p.color, p.color, false);
    }
    ctx.globalAlpha = 1;
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i]; p.life -= dt; if (p.life <= 0) { pops.splice(i, 1); continue; }
      if (p.ring) { ctx.globalAlpha = p.life * 2; ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(player.segs[0].x, player.segs[0].y, 30 + (0.5 - p.life) * 160, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; continue; }
      ctx.globalAlpha = Math.min(1, p.life * 2.5);
      ctx.font = `900 ${p.big ? 30 : 15}px ui-rounded, system-ui, sans-serif`; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = '#0a0f2a'; ctx.strokeText(p.text, p.x, p.y - (1 - p.life) * 30);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y - (1 - p.life) * 30);
      ctx.globalAlpha = 1;
    }
    // boss arrow
    if (boss && !boss.dead && player && !player.dead) {
      const bh = boss.segs[0];
      if (!vis(bh.x, bh.y)) {
        const a = Math.atan2(bh.y - cam.y, bh.x - cam.x);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const x = VX() + Math.cos(a) * (VMIN() / 2 - 40), y = VY() + Math.sin(a) * (VMIN() / 2 - 40);
        ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillStyle = '#ff4d5e'; ctx.strokeStyle = '#0a0f2a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-10, -13); ctx.lineTo(-10, 13); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      }
    }
    // vignette
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!vigCache || vigCache.w !== W || vigCache.h !== H) {
      vigCache = document.createElement('canvas'); vigCache.width = Math.ceil(W / 2); vigCache.height = Math.ceil(H / 2); vigCache.w = W; vigCache.h = H;
      const g = vigCache.getContext('2d'), w = vigCache.width, h = vigCache.height;
      const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.45, w / 2, h / 2, Math.max(w, h) * 0.8);
      vg.addColorStop(0, 'rgba(3,5,20,0)'); vg.addColorStop(1, 'rgba(3,5,20,.6)'); g.fillStyle = vg; g.fillRect(0, 0, w, h);
    }
    ctx.drawImage(vigCache, 0, 0, W, H);
    drawMini();
    // joystick
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (joy.on && state === 'play') {
      ctx.globalAlpha = 0.35; ctx.fillStyle = '#0a0f2a'; ctx.beginPath(); ctx.arc(joy.x, joy.y, 60, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.8; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(joy.cx, joy.cy, 26, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    }
  }

  const mctx = $('mini').getContext('2d');
  let miniT = 0;
  function drawMini() {
    if (state === 'menu' || (miniT = (miniT + 1) % 3)) return;
    const S = 192, k = (S / 2 - 6) / MINI_R, c = player.segs[0];
    mctx.clearRect(0, 0, S, S);
    mctx.fillStyle = 'rgba(10,15,42,.6)'; mctx.beginPath(); mctx.arc(S / 2, S / 2, S / 2 - 2, 0, Math.PI * 2); mctx.fill();
    mctx.strokeStyle = 'rgba(255,94,207,.8)'; mctx.lineWidth = 3; mctx.stroke();
    for (const q of powers) { if (Math.hypot(q.x - c.x, q.y - c.y) > MINI_R) continue; mctx.fillStyle = POWERS[q.type].color; mctx.fillRect(S / 2 + (q.x - c.x) * k - 3, S / 2 + (q.y - c.y) * k - 3, 6, 6); }
    for (const o of snakes) {
      if (o.dead) continue;
      const dx = o.segs[0].x - c.x, dy = o.segs[0].y - c.y; if (Math.hypot(dx, dy) > MINI_R - 10) continue;
      const big = o === boss || o === player || o.lv > player.lv;
      mctx.fillStyle = o === player ? '#ffd23f' : o === boss ? '#ff4d5e' : o.lv > player.lv ? 'rgba(255,120,140,.9)' : 'rgba(255,255,255,.75)';
      mctx.beginPath(); mctx.arc(S / 2 + dx * k, S / 2 + dy * k, o === player || o === boss ? 8 : big ? 5 : 4, 0, Math.PI * 2); mctx.fill();
      if (o === player) { mctx.strokeStyle = '#0a0f2a'; mctx.lineWidth = 2.5; mctx.stroke(); }
    }
  }
  function tut(text, at) { after(at, () => { if (state !== 'play') return; $('tut').textContent = text; $('tut').classList.add('show'); }); }

  // ---------- HUD ----------
  let hudT = 0, fpsN = 0, fpsT = 0;
  function hud(dt) {
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
    if (npT > 0) { npT -= dt; if (npT <= 0) $('np').classList.remove('show'); }
    if (state === 'revive' && revLeft >= 0) { revLeft -= dt; const n = Math.max(0, Math.ceil(revLeft)); $('revCount').textContent = n; if (revLeft <= 0) skipRevive(); }
    fpsN++; fpsT += dt; if (SHOW_FPS && fpsT >= 0.5) { $('fps').textContent = Math.round(fpsN / fpsT) + ' fps · ' + Math.round(W * dpr) + 'x' + Math.round(H * dpr); fpsN = 0; fpsT = 0; }
    hudT -= dt; if (hudT > 0 || state !== 'play') return; hudT = 0.2;
    const s = Math.max(0, Math.ceil(timeLeft));
    $('timer').textContent = (bossPhase ? 'BOSS ' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    $('lvl').textContent = 'LV ' + player.lv;
    $('boost').classList.toggle('off', player.lv <= 6);
    $('pw').innerHTML = Object.keys(pw).filter(k => pw[k] > 0).map(k => `<div class="pill t" style="background:${POWERS[k].color}">${POWERS[k].label} ${Math.ceil(pw[k])}</div>`).join('');
    const top = snakes.filter(x => !x.dead).sort((a, b) => b.lv - a.lv);
    const rows = top.slice(0, 5); if (!player.dead && !rows.includes(player)) rows.push(player);
    $('board').innerHTML = rows.map(x => `<div class="${x === player ? 'me' : ''}"><span>${top.indexOf(x) + 1}. ${x.name}</span><span>${x.lv}</span></div>`).join('');
  }

  // ---------- menu ----------
  function renderMenu() {
    $('coinTxt').textContent = save.coins;
    $('best').textContent = save.best ? `BEST LV ${save.best}` : '';
    $('ups').innerHTML = '';
    for (const u of UPS) {
      const l = save.up[u.id] || 0, maxed = u.max && l >= u.max, cost = u.cost(l);
      const b = document.createElement('button'); b.className = 'up';
      b.innerHTML = `<b class="t">${u.name}</b><i>${u.desc(l)}</i><span>${maxed ? 'MAX' : cost}</span>`;
      b.disabled = maxed || save.coins < cost;
      b.onclick = () => { if (save.coins < cost || maxed) return; save.coins -= cost; save.up[u.id] = l + 1; writeSave(); blip(700, 1100, 0.15, 0.2, 'triangle'); renderMenu(); };
      $('ups').appendChild(b);
    }
    $('skins').innerHTML = '';
    SHOP.forEach((k, i) => {
      const own = (save.owned || [0]).includes(i);
      const b = document.createElement('button'); b.className = 'sk' + (save.skin === i ? ' sel' : '') + (own ? '' : ' lock');
      const bg = k.rainbow ? 'conic-gradient(#ff4d5e,#ffd23f,#3ddc84,#3aa0ff,#b07bff,#ff4d5e)' : k.stripe ? `repeating-linear-gradient(45deg,${k.c[0]} 0 6px,${k.stripe} 6px 10px)` : `radial-gradient(circle at 35% 30%,#fff,${k.c[0]} 30%,${k.c[1]})`;
      b.innerHTML = `<i style="background:${bg}"></i><span>${own ? (save.skin === i ? '✓' : '') : k.cost}</span>`;
      b.onclick = () => {
        if (own) save.skin = i;
        else if (save.coins >= k.cost) { save.coins -= k.cost; save.owned = [...(save.owned || [0]), i]; save.skin = i; blip(700, 1400, 0.2, 0.2, 'triangle'); }
        else { b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], 200); return; }
        writeSave(); player.skin = playerSkin(); renderMenu();
      };
      $('skins').appendChild(b);
    });
  }
  $('playBtn').onclick = () => { initAudio(); $('menu').classList.remove('show'); document.body.classList.remove('menu'); newRound(); };
  $('againBtn').onclick = () => {
    const go = () => { $('result').classList.remove('show'); stopMusic(); state = 'menu'; player.skin = playerSkin(); renderMenu(); $('menu').classList.add('show'); document.body.classList.add('menu'); };
    save.rounds = (save.rounds || 0) + 1; writeSave();
    // YouTube interstitial at a natural break, every second round
    if (yt && save.rounds % 2 === 0) yt.ads.requestInterstitialAd().then(go, go); else go();
  };
  if (!yt) document.addEventListener('visibilitychange', () => { paused = document.hidden; if (ac) (paused ? ac.suspend() : ac.resume()); }); // web preview only; inside YouTube onPause/onResume are the single source of truth
  $('doubleBtn').onclick = () => {
    if (!yt) return;
    yt.ads.requestRewardedAd('double-coins').then(ok => { if (ok !== false) { save.coins += lastCoins; writeSave(); $('resCoins').textContent = lastCoins * 2; } $('doubleBtn').style.display = 'none'; }).catch(() => { $('doubleBtn').style.display = 'none'; });
  };
  $('mute').onclick = () => { initAudio(); setMuted(!muted); };
  if (yt) $('mute').style.display = 'none'; // YouTube owns the mute button; music/FX toggles live in settings
  function renderSettings() { document.querySelectorAll('.tg').forEach(b => b.classList.toggle('on', !!save[b.dataset.k])); }
  document.querySelectorAll('.tg').forEach(b => b.onclick = () => { initAudio(); save[b.dataset.k] = save[b.dataset.k] ? 0 : 1; writeSave(); applyMix(); renderSettings(); blip(600, 900, 0.1, 0.15, 'triangle'); });
  $('gearBtn').onclick = () => { renderSettings(); $('settings').classList.add('show'); };
  $('setDone').onclick = () => $('settings').classList.remove('show');
  addEventListener('keydown', e => { if (e.key === 'Escape') { $('settings').classList.remove('show'); } }); // never preventDefault on Esc

  // ---------- Playables hooks ----------
  if (yt) {
    try {
      setMuted(!yt.system.isAudioEnabled());
      yt.system.onAudioEnabledChange(on => setMuted(!on));
      yt.system.onPause(() => { paused = true; boostHeld = false; bb.classList.remove('on'); if (ac) ac.suspend(); if (saveDirty || state === 'play') writeSave(); });
      yt.system.onResume(() => { paused = false; last = performance.now(); acc = 0; if (ac && ac.state === 'suspended') ac.resume(); if (saveDirty) writeSave(); });
    } catch (e) {}
  }
  let paused = false;

  // ---------- loop ----------
  setMuted(false);
  // idle background on the menu
  player = makeSnake(8, playerSkin(), 'YOU', { x: 0, y: 0 }, true); player.speed = 110;
  snakes = [player]; for (let i = 0; i < 6; i++) { const b = makeSnake(Math.round(rand(3, 30)), SKINS[i], NAMES[i], randPos(100, 700), true); b.speed = 110; snakes.push(b); }
  for (let i = 0; i < 200; i++) { const p = randPos(0, 900); addOrb(p.x, p.y); }
  cam.z = zoomFor(player);
  let last = performance.now(), first = true, acc = 0, ioT = 1; const STEP = 1 / 90; // max physics step
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!paused) {
      if (state === 'play') watchPerf(dt);
    ioT -= dt; if (ioT <= 0 && io) { ioT = 1; try { io.unobserve(cv); io.observe(cv); } catch (e) {} }
      tickTimers(dt);
      if (state === 'menu') idle(dt);
      else { // simulate exactly the time this frame covers (sub-stepped), so motion is even on 60, 120 or 150 Hz screens
        const total = dt * TS, n = Math.min(12, Math.max(1, Math.ceil(total / STEP))), h = total / n; for (let i = 0; i < n; i++) update(h); }
      render(now / 1000, dt); hud(dt);
    }
    if (first) { first = false; if (yt) { try { yt.game.firstFrameReady(); } catch (e) {} } boot(); }
    requestAnimationFrame(frame);
  }
  function idle(dt) {
    for (const s of snakes) {
      s.think -= dt; if (s.think <= 0) { s.want += rand(-1, 1); const h = s.segs[0]; if (Math.hypot(h.x, h.y) > 500) s.want = Math.atan2(-h.y, -h.x); s.think = rand(0.5, 1.2); }
      let da = ((s.want - s.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI; s.ang += Math.max(-2 * dt, Math.min(2 * dt, da));
      const h = s.segs[0]; h.x += Math.cos(s.ang) * s.speed * dt; h.y += Math.sin(s.ang) * s.speed * dt;
      const gap = radFor(s.lv) * 0.9;
      for (let i = 1; i < s.segs.length; i++) { const a = s.segs[i - 1], b = s.segs[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1; if (d > gap) { b.x = a.x + dx / d * gap; b.y = a.y + dy / d * gap; } }
    }
    cam.x += (0 - cam.x) * dt; cam.y += (0 - cam.y) * dt;
  }
  async function boot() {
    await loadCloud();
    player.skin = playerSkin(); renderMenu();
    $('loading').classList.remove('show'); $('loading').style.display = 'none';
    if (yt) { try { yt.game.gameReady(); } catch (e) {} }
  }
  requestAnimationFrame(frame);
})();
</script>
